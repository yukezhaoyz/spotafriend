<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotafriend chat</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-2: #2a2a2a;
      --text: #ffffff;
      --muted: #a7a7a7;
      --accent: #1ed760;
      --accent-ink: #000000;
      --error: #f3727f;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 640px; height: 100%; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; }
    .head { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--surface-2); }
    .brand { color: var(--muted); text-decoration: none; font-weight: 700; }
    .brand span { color: var(--accent); }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; flex: none;
      background: var(--accent); color: var(--accent-ink);
      display: grid; place-items: center; font-size: 18px; font-weight: 800;
    }
    .who { flex: 1; min-width: 0; }
    .who .name { font-size: 18px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { color: var(--muted); font-size: 13px; }
    .status.live::before { content: "●"; color: var(--accent); margin-right: 5px; font-size: 10px; vertical-align: 1px; }
    .status.problem { color: var(--error); }

    .log { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 6px; }
    .empty { margin: auto; text-align: center; color: var(--muted); max-width: 320px; }
    .bubble { max-width: 80%; padding: 8px 12px; border-radius: 16px; word-wrap: break-word; white-space: pre-wrap; }
    .bubble.mine { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
    .bubble.theirs { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
    .bubble.pending { opacity: 0.6; }
    .meta { font-size: 11px; color: var(--muted); padding: 0 6px; }
    .meta.mine { align-self: flex-end; }
    .meta.theirs { align-self: flex-start; }

    form { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--surface-2); }
    input {
      flex: 1; min-width: 0; background: var(--surface-2); color: var(--text);
      border: 1px solid transparent; border-radius: 999px; padding: 12px 18px; font: inherit; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--accent); color: var(--accent-ink);
      border: 0; border-radius: 999px; padding: 12px 22px;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: var(--error); font-size: 13px; min-height: 1.5em; padding-top: 4px; }
  </style>
</head>
<body>
<main>
  <div class="head">
    <a class="brand" href="/">Spot<span>a</span>friend</a>
    <div class="avatar" id="avatar"></div>
    <div class="who">
      <div class="name" id="with-name"></div>
      <div class="status" id="status" role="status">Connecting to AWS AppSync…</div>
    </div>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <form id="form">
    <input id="input" placeholder="Say hi…" autocomplete="off" maxlength="1000" aria-label="Message">
    <button type="submit">Send</button>
  </form>
  <div class="error" id="error" role="alert"></div>
</main>

{% include "tracks/_appsync.html" %}
<script>
// A chat that lives only on AWS AppSync: both pages subscribe to this room's
// channel and publish messages to it. Nothing is stored anywhere, so a page
// that joins late says HELLO and the other page answers with the HISTORY.
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);  // strings become text nodes, never HTML
  return node;
}

const params = new URLSearchParams(location.search);
const ROOM = params.get("room") || "";
const ME = params.get("me") || "You";
// No "with" when you open the room from your own match: the header fills in
// with whoever joins.
let WITH = params.get("with") || "";
const MAX_TEXT = 1000;
const HISTORY_MAX = 50;

// Keep the same id across reloads of this tab, so our old messages stay "mine".
function clientId() {
  const key = `spotafriend-chat-client-${ROOM}`;
  try {
    const saved = sessionStorage.getItem(key);
    if (saved) return saved;
    const id = crypto.randomUUID();
    sessionStorage.setItem(key, id);
    return id;
  } catch (_) {
    return crypto.randomUUID();
  }
}
const CLIENT_ID = clientId();

const messages = new Map();  // id -> { id, clientId, fromName, text, sentAtMs, pending }
let theyreHere = false;

function showWith() {
  document.title = WITH ? `Chat with ${WITH} · Spotafriend` : "Your chat room · Spotafriend";
  $("avatar").textContent = WITH ? WITH[0].toUpperCase() : "♪";
  $("with-name").textContent = WITH || "Your chat room";
}
showWith();

function learnWith(name) {
  if (WITH || !name) return;
  WITH = String(name).slice(0, 60);
  showWith();
  renderedSignature = null;
}

function setStatus(text, cls = "") {
  $("status").className = `status ${cls}`;
  $("status").textContent = text;
}

function showLive() {
  setStatus(theyreHere ? `${WITH || "Someone"} is in the chat` : `Live on AWS AppSync as ${ME} · waiting for ${WITH || "someone to join"}`, "live");
}

function disable(text) {
  setStatus(text, "problem");
  $("input").disabled = $("form").querySelector("button").disabled = true;
}

function timeOf(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

let renderedSignature = null;

function render() {
  const list = [...messages.values()].sort((a, b) => a.sentAtMs - b.sentAtMs);
  const signature = list.map((m) => `${m.id}:${m.pending}`).join(",");
  if (signature === renderedSignature) return;  // nothing new
  renderedSignature = signature;
  const log = $("log");
  if (!list.length) {
    log.replaceChildren(el("div", { class: "empty" },
      WITH ? `This chat runs live through AWS AppSync. Say hi to ${WITH}: they'll see everything here once they open the chat.`
        : "This chat runs live through AWS AppSync. Anyone who opens your match from their bell joins you here and sees everything said so far."));
    return;
  }
  const nodes = [];
  list.forEach((m, i) => {
    const mine = m.clientId === CLIENT_ID;
    const side = mine ? "mine" : "theirs";
    nodes.push(el("div", { class: `bubble ${side} ${m.pending ? "pending" : ""}` }, m.text));
    const next = list[i + 1];
    if (!next || next.clientId !== m.clientId) {
      const who = mine ? "You" : m.fromName || WITH || "Them";
      nodes.push(el("div", { class: `meta ${side}` }, m.pending ? "Sending…" : `${who} · ${timeOf(m.sentAtMs)}`));
    }
  });
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.replaceChildren(...nodes);
  if (atBottom || list[list.length - 1].clientId === CLIENT_ID) log.scrollTop = log.scrollHeight;
}

function addMessage(m) {
  if (!m || typeof m.id !== "string" || typeof m.text !== "string") return;
  if (messages.has(m.id) && !messages.get(m.id).pending) return;
  messages.set(m.id, {
    id: m.id, clientId: m.clientId, fromName: String(m.fromName || "").slice(0, 60),
    text: m.text.slice(0, MAX_TEXT), sentAtMs: Number(m.sentAtMs) || Date.now(), pending: false,
  });
}

function sentMessages() {
  return [...messages.values()].filter((m) => !m.pending)
    .sort((a, b) => a.sentAtMs - b.sentAtMs).slice(-HISTORY_MAX)
    .map(({ pending, ...m }) => m);
}

function onEvent(e) {
  if (e.clientId !== CLIENT_ID) learnWith(e.fromName);
  if (e.type === "CHAT_MESSAGE") {
    addMessage(e);
  } else if (e.type === "HELLO" && e.clientId !== CLIENT_ID) {
    // Someone opened the chat: hand them what they missed.
    if (!theyreHere) { theyreHere = true; showLive(); }
    const history = sentMessages();
    live.publish(ROOM_CHANNEL, { type: "HISTORY", clientId: CLIENT_ID, fromName: ME, messages: history }).catch(() => {});
  } else if (e.type === "HISTORY" && e.clientId !== CLIENT_ID) {
    if (!theyreHere) { theyreHere = true; showLive(); }
    for (const m of e.messages || []) addMessage(m);
  }
  render();
}

let live = null;
let ROOM_CHANNEL = null;

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  if (text.length > MAX_TEXT) { $("error").textContent = `Messages are limited to ${MAX_TEXT} characters`; return; }
  $("input").value = "";
  $("error").textContent = "";
  const m = { id: crypto.randomUUID(), clientId: CLIENT_ID, fromName: ME, text, sentAtMs: Date.now() };
  messages.set(m.id, { ...m, pending: true });  // "Sending…" until AppSync confirms
  render();
  try {
    await live.publish(ROOM_CHANNEL, { type: "CHAT_MESSAGE", ...m });
    if (messages.get(m.id)?.pending) messages.set(m.id, { ...m, pending: false });
  } catch (err) {
    messages.delete(m.id);
    $("input").value = text;
    $("error").textContent = err.message;
  }
  render();
  $("input").focus();
});

if (!/^[0-9a-f-]{36}$/.test(ROOM)) {
  disable("This chat link is missing its room. Start a chat from a match on the main page.");
} else if (!APPSYNC) {
  disable("Live chat is off: run `manage.py appsync_setup` and add its settings to .env");
} else {
  live = new AppSyncEvents(APPSYNC, {
    onStatus(state, detail) {
      if (state === "live") showLive();
      else if (state === "problem") setStatus(detail, "problem");
      else if (state === "connecting") setStatus("Connecting to AWS AppSync…");
      else setStatus("Lost the connection to AWS, reconnecting…", "problem");
    },
  });
  ROOM_CHANNEL = live.channel("rooms", ROOM);
  live.subscribe(ROOM_CHANNEL, onEvent,
    () => live.publish(ROOM_CHANNEL, { type: "HELLO", clientId: CLIENT_ID, fromName: ME }).catch(() => {}));
  render();
  $("input").focus();
}
</script>
</body>
</html>
