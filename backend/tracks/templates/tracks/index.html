<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotafriend</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-2: #2a2a2a;
      --text: #ffffff;
      --muted: #a7a7a7;
      --accent: #1ed760;
      --accent-ink: #000000;
      --error: #f3727f;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 880px; margin: 0 auto; padding: 40px 16px 80px; }
    h1 { font-size: 32px; margin: 0; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    h2 { font-size: 20px; margin: 0 0 4px; }
    .tagline { color: var(--muted); margin: 4px 0 28px; }
    .muted { color: var(--muted); }

    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input {
      background: var(--surface-2); color: var(--text);
      border: 1px solid transparent; border-radius: 999px;
      padding: 12px 18px; font: inherit; outline: none;
    }
    input:focus { border-color: var(--accent); }
    #name { flex: 0 1 160px; min-width: 0; }
    #url { flex: 1 1 320px; min-width: 0; }
    button {
      background: var(--accent); color: var(--accent-ink);
      border: 0; border-radius: 999px; padding: 12px 24px;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: progress; }

    .demo-picks { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip {
      background: var(--surface); color: var(--muted);
      border: 1px solid var(--surface-2); border-radius: 999px;
      padding: 4px 12px; font-size: 13px; font-weight: 500;
    }
    .chip:hover { color: var(--text); border-color: var(--muted); }
    .error { color: var(--error); margin-top: 12px; min-height: 1.5em; }

    section { margin-top: 36px; }
    .hidden { display: none !important; }

    .tracks { list-style: none; padding: 0; margin: 12px 0 0; background: var(--surface); border-radius: var(--radius); }
    .tracks li {
      display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center;
      padding: 8px 14px; border-bottom: 1px solid var(--surface-2);
    }
    .tracks li:last-child { border-bottom: 0; }
    .tracks .num { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    .tracks .title { overflow: hidden; }
    .tracks .title div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tracks .genre { color: var(--muted); font-size: 13px; text-align: right; }
    .tracks li.unmatched .title { opacity: 0.5; }
    .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--surface-2); border-radius: 4px; padding: 0 6px; }

    .finding { color: var(--muted); display: flex; align-items: center; gap: 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 0.2; } to { opacity: 1; } }

    .best {
      margin-top: 12px; padding: 24px; border-radius: var(--radius);
      background: linear-gradient(135deg, #1a3d27, var(--surface) 60%);
      display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: start;
    }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--accent); color: var(--accent-ink);
      display: grid; place-items: center; font-size: 30px; font-weight: 800;
    }
    .best .name { font-size: 26px; font-weight: 800; }
    .score { color: var(--accent); font-weight: 700; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .pill { background: rgba(30, 215, 96, 0.14); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
    .best h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 14px 0 4px; }
    .best ol { margin: 0; padding-left: 20px; }

    .others { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
    .other { background: var(--surface); border-radius: var(--radius); padding: 14px; }
    .other .name { font-weight: 700; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .bell-wrap { position: relative; }
    .bell {
      position: relative; background: var(--surface); color: var(--text);
      width: 42px; height: 42px; padding: 0; display: grid; place-items: center;
    }
    .bell:hover { background: var(--surface-2); }
    .bell svg { width: 20px; height: 20px; }
    .badge {
      position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 999px; background: var(--error); color: #fff;
      font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    }
    .notif-panel {
      position: absolute; right: 0; top: 50px; z-index: 20; width: 320px; max-width: calc(100vw - 32px);
      background: var(--surface); border: 1px solid var(--surface-2); border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); overflow: hidden;
    }
    .notif-panel h3 { margin: 0; padding: 12px 14px; font-size: 14px; border-bottom: 1px solid var(--surface-2); }
    .notif-list { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
    .notif-list li { border-bottom: 1px solid var(--surface-2); }
    .notif-list li:last-child { border-bottom: 0; }
    .notif-item {
      display: block; width: 100%; text-align: left; background: none; color: var(--text);
      border-radius: 0; padding: 10px 14px; font-weight: 400; font-size: 14px;
    }
    .notif-item:hover { background: var(--surface-2); }
    .notif-item.unread { background: rgba(30, 215, 96, 0.08); }
    .notif-item.unread::before { content: "●"; color: var(--accent); margin-right: 6px; font-size: 10px; vertical-align: 2px; }
    .notif-time { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .notif-empty { padding: 18px 14px; color: var(--muted); font-size: 14px; }
    .email-alerts { border-top: 1px solid var(--surface-2); padding: 12px 14px; font-size: 13px; }
    .email-alerts form { display: flex; gap: 6px; margin-top: 8px; }
    .email-alerts input { flex: 1; min-width: 0; padding: 7px 12px; font-size: 13px; }
    .email-alerts button { padding: 7px 12px; font-size: 13px; }
    .email-status { color: var(--muted); margin-top: 6px; }
    .email-status.on { color: var(--accent); }
    .email-status.problem { color: var(--error); }

    .toast {
      position: fixed; left: 16px; bottom: 16px; z-index: 30; max-width: 320px;
      background: var(--surface-2); color: var(--text); border-left: 4px solid var(--accent);
      border-radius: var(--radius); padding: 12px 16px; text-align: left; font-weight: 400;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); animation: slide-in 0.25s ease-out;
    }
    .toast strong { display: block; font-size: 13px; color: var(--accent); }
    @keyframes slide-in { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

    .message-btn { margin-top: 14px; padding: 8px 18px; font-size: 14px; }
    .other .message-btn { margin-top: 8px; padding: 6px 14px; font-size: 13px; }

    .chat {
      position: fixed; right: 16px; bottom: 16px; z-index: 10;
      width: 340px; height: 460px; max-height: calc(100vh - 32px);
      background: var(--surface); border: 1px solid var(--surface-2); border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--surface-2); }
    .chat-head .avatar { width: 32px; height: 32px; font-size: 15px; }
    .chat-head .who { flex: 1; font-weight: 700; }
    .chat-close { background: none; color: var(--muted); padding: 4px 8px; font-size: 20px; line-height: 1; }
    .chat-close:hover { color: var(--text); }
    .chat-log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
    .bubble { max-width: 80%; padding: 8px 12px; border-radius: 16px; word-wrap: break-word; white-space: pre-wrap; }
    .bubble.mine { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
    .bubble.theirs { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
    .chat-empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; }
    .typing { color: var(--muted); font-size: 13px; padding: 0 14px 6px; min-height: 1.5em; }
    .bubble.song { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; white-space: normal; }
    .bubble.song .note {
      grid-row: span 2; width: 34px; height: 34px; border-radius: 6px;
      display: grid; place-items: center; font-size: 16px; background: rgba(0, 0, 0, 0.25);
    }
    .bubble.song .song-title { font-weight: 700; }
    .bubble.song .song-artists { font-size: 13px; opacity: 0.75; }
    .bubble.song .song-label { grid-column: 1 / -1; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }

    .song-picker { border-top: 1px solid var(--surface-2); padding: 10px 10px 0; }
    .song-picker input { width: 100%; padding: 8px 14px; font-size: 14px; }
    .song-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: 180px; overflow-y: auto; }
    .song-option {
      display: block; width: 100%; text-align: left; background: none; color: var(--text);
      border-radius: 6px; padding: 6px 8px; font-weight: 400; font-size: 14px;
    }
    .song-option:hover, .song-option:focus-visible { background: var(--surface-2); outline: none; }
    .song-option span { display: block; color: var(--muted); font-size: 12px; }
    .song-none { color: var(--muted); font-size: 13px; padding: 6px 8px; }

    .chat-form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--surface-2); }
    .chat-form .song-btn { background: var(--surface-2); color: var(--text); padding: 10px 12px; }
    .chat-form .song-btn[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); }
    .chat-form input { flex: 1; min-width: 0; padding: 10px 14px; }
    .chat-form button { padding: 10px 16px; }

    @media (max-width: 560px) {
      .chat { left: 8px; right: 8px; bottom: 8px; width: auto; }
      .toast { left: 8px; right: 8px; max-width: none; }
      .best { grid-template-columns: 1fr; }
      .tracks .genre { display: none; }
      .tracks li { grid-template-columns: 28px 1fr; }
    }
  </style>
</head>
<body>
<main>
  <div class="topbar">
    <h1>Spot<span>a</span>friend</h1>
    <div class="bell-wrap hidden" id="bell-wrap">
      <button class="bell" id="bell" type="button" aria-label="Notifications" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="badge hidden" id="badge"></span>
      </button>
      <div class="notif-panel hidden" id="notif-panel">
        <h3>Notifications</h3>
        <ul class="notif-list" id="notif-list"></ul>
        <div class="email-alerts hidden" id="email-alerts">
          <strong>Email me when I'm away</strong>
          <form id="email-form">
            <input id="email-input" type="email" placeholder="you@example.com" autocomplete="email" aria-label="Email address" required>
            <button type="submit">Save</button>
          </form>
          <div class="email-status" id="email-status" role="status"></div>
        </div>
      </div>
    </div>
  </div>
  <p class="tagline">Find your people through the music you love.</p>

  <form id="form">
    <input id="name" placeholder="Your name" autocomplete="off">
    <input id="url" placeholder="Paste a Spotify playlist link" autocomplete="off" required>
    <button id="go" type="submit">Find my people</button>
  </form>
  <div class="demo-picks" id="picks"><span class="muted">Demo playlists:</span></div>
  <div class="error" id="error" role="alert"></div>

  <section id="playlist" class="hidden">
    <h2 id="playlist-name"></h2>
    <div class="muted" id="coverage"></div>
    <ol class="tracks" id="tracks"></ol>
  </section>

  <section id="match" class="hidden">
    <h2>Your closest match</h2>
    <div class="finding" id="finding"><span class="dot"></span>Comparing your taste with other listeners…</div>
    <div id="best"></div>
    <div id="others-wrap" class="hidden">
      <h2 style="margin-top:28px">Also on your wavelength</h2>
      <div class="others" id="others"></div>
    </div>
  </section>
</main>

<aside class="chat hidden" id="chat" aria-label="Chat">
  <div class="chat-head">
    <div class="avatar" id="chat-avatar"></div>
    <div class="who" id="chat-name"></div>
    <button class="chat-close" id="chat-close" type="button" aria-label="Close chat">×</button>
  </div>
  <div class="chat-log" id="chat-log" aria-live="polite"></div>
  <div class="typing" id="chat-typing"></div>
  <div class="song-picker hidden" id="song-picker">
    <input id="song-search" placeholder="Search your playlist…" autocomplete="off" aria-label="Search your playlist">
    <ul class="song-list" id="song-list"></ul>
  </div>
  <form class="chat-form" id="chat-form">
    <button class="song-btn" id="song-btn" type="button" aria-label="Share a song from your playlist" aria-expanded="false" title="Share a song">🎵</button>
    <input id="chat-input" placeholder="Say hi…" autocomplete="off" maxlength="1000">
    <button type="submit">Send</button>
  </form>
</aside>

<div id="toast-slot"></div>

<script>
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);  // strings become text nodes, never HTML
  return node;
}

async function loadDemoPicks() {
  const res = await fetch("/api/playlists/");
  const { playlists } = await res.json();
  for (const p of playlists) {
    const chip = el("button", { class: "chip", type: "button" }, p.name);
    chip.onclick = () => { $("url").value = p.url; $("url").focus(); };
    $("picks").append(chip);
  }
}

function renderTracks(data) {
  const analyzed = data.tracks.filter((t) => t.analyzed).length;
  $("playlist-name").textContent = data.playlist.name;
  $("coverage").textContent = `${data.tracks.length} songs · ${analyzed} analyzed`;
  $("tracks").replaceChildren(...data.tracks.map((t, i) =>
    el("li", { class: t.analyzed ? "" : "unmatched" },
      el("span", { class: "num" }, String(i + 1)),
      el("div", { class: "title" },
        el("div", {}, t.name),
        el("div", { class: "muted" }, t.artists.join(", "))),
      el("span", { class: "genre" }, t.analyzed ? t.genres.join(", ") : el("span", { class: "tag" }, "not in dataset")))
  ));
  $("playlist").classList.remove("hidden");
}

function reasonPills(m) {
  const pills = [...m.reasons];
  if (m.shared_artists.length) pills.push(`you both play ${m.shared_artists.slice(0, 3).join(", ")}`);
  return el("div", { class: "pills" }, ...pills.map((r) => el("span", { class: "pill" }, r)));
}

function sharedSummary(names, shown = 5) {
  const more = names.length - shown;
  return names.slice(0, shown).join(" · ") + (more > 0 ? ` · +${more} more` : "");
}

function renderMatches(matches) {
  $("finding").classList.add("hidden");
  if (!matches.length) {
    $("best").replaceChildren(el("p", { class: "muted" }, "None of these songs are in our dataset yet, so we can't match you. Try another playlist."));
    return;
  }
  const [best, ...rest] = matches;
  $("best").replaceChildren(
    el("div", { class: "best" },
      el("div", { class: "avatar" }, best.name[0]),
      el("div", {},
        el("div", { class: "name" }, best.name),
        el("div", { class: "score" }, `${Math.round(best.score)}% match`),
        reasonPills(best),
        best.shared_tracks.length ? el("div", {}, el("h3", {}, `${best.shared_tracks.length} songs you share`), el("div", {}, sharedSummary(best.shared_tracks))) : null,
        el("h3", {}, `${best.name}'s top songs`),
        el("ol", {}, ...best.top_songs.map((s) => el("li", {}, `${s.name} `, el("span", { class: "muted" }, `— ${s.artists.join(", ")}`)))),
        messageButton(best)))
  );
  $("others").replaceChildren(...rest.map((m) =>
    el("div", { class: "other" },
      el("div", { class: "name" }, m.name),
      el("div", { class: "score" }, `${Math.round(m.score)}% match`),
      reasonPills(m),
      messageButton(m))
  ));
  $("others-wrap").classList.toggle("hidden", rest.length === 0);
}

const pause = (ms) => new Promise((r) => setTimeout(r, ms));

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("error").textContent = "";
  $("go").disabled = true;
  try {
    const res = await fetch("/api/import/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ playlist_url: $("url").value, name: $("name").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong");
    me = data.user;
    myTracks = data.tracks;
    closeChat();
    startNotifications();

    // Reveal in two beats: the playlist first, then who matched.
    $("match").classList.add("hidden");
    renderTracks(data);
    $("best").replaceChildren();
    $("others-wrap").classList.add("hidden");
    $("finding").classList.remove("hidden");
    $("match").classList.remove("hidden");
    await pause(1200);
    renderMatches(data.matches);
    $("match").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    $("error").textContent = err.message;
  } finally {
    $("go").disabled = false;
  }
});

// ---- Chat ----------------------------------------------------------------
// The open chat checks for new messages every POLL_MS.
const POLL_MS = 1500;
let me = null;          // the user created by the last import
let myTracks = [];      // that user's playlist songs, for sharing in chat
let openChat = null;    // { id, other, lastShown }
let pollTimer = null;

function messageButton(match) {
  const btn = el("button", { class: "message-btn", type: "button" }, `Message ${match.name}`);
  btn.onclick = () => poll(() => startChat(match.user_id));
  return btn;
}

async function api(url, body) {
  const res = await fetch(url, body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = res.headers.get("Content-Type")?.includes("json") ? await res.json() : {};
  if (!res.ok) throw Object.assign(new Error(data.error || "Something went wrong"), { status: res.status });
  return data;
}

// Background checks (chat, notifications) shouldn't throw into the console.
// A 404 means the server restarted and forgot this user, so start over.
async function poll(fn) {
  try {
    await fn();
  } catch (err) {
    if (err.status === 404 && me) resetSession();
  }
}

function resetSession() {
  me = null;
  closeChat();
  clearInterval(notifTimer);
  closeNotifPanel();
  $("bell-wrap").classList.add("hidden");
  $("toast-slot").replaceChildren();
  $("error").textContent = "The server restarted, so please submit your playlist again.";
}

async function startChat(otherUserId) {
  if (!me) return;
  const data = await api("/api/conversations/", { user_id: me.id, other_user_id: otherUserId });
  openChat = { id: data.id, other: data.other, lastShown: null };
  $("chat-avatar").textContent = data.other.name[0];
  $("chat-name").textContent = data.other.name;
  $("chat").classList.remove("hidden");
  renderChat(data);
  $("chat-input").focus();
  poll(async () => { await refreshChat(); await pollNotifications(); });  // marks this chat's notices read
  clearInterval(pollTimer);
  pollTimer = setInterval(() => poll(refreshChat), POLL_MS);
}

function closeChat() {
  closeSongPicker();
  clearInterval(pollTimer);
  openChat = null;
  $("chat").classList.add("hidden");
}

async function refreshChat() {
  if (!openChat) return;
  const id = openChat.id;
  const data = await api(`/api/conversations/${id}/messages/?viewer=${me.id}`);
  if (openChat && openChat.id === id) renderChat(data);
}

function renderChat(data) {
  $("chat-typing").textContent = data.typing ? `${openChat.other.name} is typing…` : "";
  const last = data.messages.length ? data.messages[data.messages.length - 1].id : null;
  if (last === openChat.lastShown && $("chat-log").childElementCount) return;  // nothing new
  openChat.lastShown = last;
  const log = $("chat-log");
  if (!data.messages.length) {
    log.replaceChildren(el("div", { class: "chat-empty" }, `Start the conversation with ${openChat.other.name}.`));
    return;
  }
  log.replaceChildren(...data.messages.map((m) => {
    const side = m.sender_id === me.id ? "mine" : "theirs";
    if (!m.song) return el("div", { class: `bubble ${side}` }, m.body);
    return el("div", { class: `bubble song ${side}` },
      el("div", { class: "song-label" }, "Shared a song"),
      el("div", { class: "note", "aria-hidden": "true" }, "♪"),
      el("div", { class: "song-title" }, m.song.name),
      el("div", { class: "song-artists" }, m.song.artists));
  }));
  log.scrollTop = log.scrollHeight;
}

$("chat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("chat-input").value.trim();
  if (!text || !openChat) return;
  $("chat-input").value = "";
  try {
    const data = await api(`/api/conversations/${openChat.id}/messages/`, { sender_id: me.id, body: text });
    renderChat(data);
  } catch (err) {
    $("chat-input").value = text;
    $("chat-typing").textContent = err.message;
  }
});

$("chat-close").onclick = closeChat;

// ---- Sharing songs in chat ------------------------------------------------
function openSongPicker() {
  $("song-picker").classList.remove("hidden");
  $("song-btn").setAttribute("aria-expanded", "true");
  $("song-search").value = "";
  renderSongList();
  $("song-search").focus();
}

function closeSongPicker() {
  $("song-picker").classList.add("hidden");
  $("song-btn").setAttribute("aria-expanded", "false");
}

function renderSongList() {
  const q = $("song-search").value.trim().toLowerCase();
  const songs = myTracks.filter((t) =>
    !q || t.name.toLowerCase().includes(q) || t.artists.some((a) => a.toLowerCase().includes(q)));
  if (!songs.length) {
    $("song-list").replaceChildren(el("li", { class: "song-none" }, "No songs match."));
    return;
  }
  $("song-list").replaceChildren(...songs.map((t) => {
    const option = el("button", { class: "song-option", type: "button" }, t.name, el("span", {}, t.artists.join(", ")));
    option.onclick = () => shareSong(t);
    return el("li", {}, option);
  }));
}

async function shareSong(track) {
  if (!openChat) return;
  closeSongPicker();
  try {
    const data = await api(`/api/conversations/${openChat.id}/messages/`, { sender_id: me.id, track_id: track.id });
    renderChat(data);
  } catch (err) {
    if (err.status === 404) return resetSession();
    $("chat-typing").textContent = err.message;
  }
  $("chat-input").focus();
}

$("song-btn").onclick = () =>
  $("song-picker").classList.contains("hidden") ? openSongPicker() : closeSongPicker();
$("song-search").addEventListener("input", renderSongList);
$("song-search").addEventListener("keydown", (e) => { if (e.key === "Escape") { closeSongPicker(); $("chat-input").focus(); } });

// ---- Notifications -------------------------------------------------------
const NOTIFY_POLL_MS = 2000;
const TOAST_MS = 5000;
let notifTimer = null;
let seenNotifications = new Set();
let renderedSignature = null;

function timeAgo(iso) {
  const secs = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  if (secs < 60) return "just now";
  if (secs < 3600) return `${Math.floor(secs / 60)} min ago`;
  return `${Math.floor(secs / 3600)} h ago`;
}

async function startNotifications() {
  clearInterval(notifTimer);
  seenNotifications = new Set();
  $("bell-wrap").classList.remove("hidden");
  await poll(() => pollNotifications({ quiet: true }));  // nothing pops up for what's already there
  notifTimer = setInterval(() => poll(pollNotifications), NOTIFY_POLL_MS);
}

async function pollNotifications({ quiet = false } = {}) {
  if (!me) return;
  const userId = me.id;
  const data = await api(`/api/users/${userId}/notifications/`);
  if (!me || me.id !== userId) return;  // a new import happened meanwhile
  renderNotifications(data);
  for (const n of data.notifications) {
    if (seenNotifications.has(n.id)) continue;
    seenNotifications.add(n.id);
    const chatIsOpen = openChat && openChat.id === n.conversation_id;
    if (!quiet && n.kind === "message" && !n.read && !chatIsOpen) showToast(n);
  }
}

function renderNotifications(data) {
  $("badge").textContent = data.unread > 9 ? "9+" : String(data.unread);
  $("badge").classList.toggle("hidden", data.unread === 0);
  $("bell").setAttribute("aria-label", `Notifications (${data.unread} unread)`);
  // Only redraw the list when it changed, so it doesn't shift under the mouse.
  const signature = data.notifications.map((n) => `${n.id}:${n.read}`).join(",");
  if (signature === renderedSignature && $("notif-list").childElementCount) return;
  renderedSignature = signature;
  if (!data.notifications.length) {
    $("notif-list").replaceChildren(el("li", { class: "notif-empty" }, "Nothing yet."));
    return;
  }
  $("notif-list").replaceChildren(...data.notifications.map((n) => {
    const item = el("button", { class: `notif-item ${n.read ? "" : "unread"}`, type: "button" },
      n.text, el("span", { class: "notif-time" }, timeAgo(n.created_at)));
    item.onclick = () => openFromNotification(n);
    return el("li", {}, item);
  }));
}

function openFromNotification(n) {
  closeNotifPanel();
  if (n.from_user) poll(() => startChat(n.from_user.id));
}

function showToast(n) {
  const toast = el("button", { class: "toast", type: "button" }, el("strong", {}, "New message"), n.text);
  toast.onclick = () => { toast.remove(); openFromNotification(n); };
  $("toast-slot").replaceChildren(toast);
  setTimeout(() => toast.remove(), TOAST_MS);
}

function closeNotifPanel() {
  $("notif-panel").classList.add("hidden");
  $("bell").setAttribute("aria-expanded", "false");
}

$("bell").onclick = async (e) => {
  e.stopPropagation();
  const opening = $("notif-panel").classList.contains("hidden");
  if (!opening) return closeNotifPanel();
  $("notif-panel").classList.remove("hidden");
  $("bell").setAttribute("aria-expanded", "true");
  loadEmailAlerts();
  // Show what was unread, then clear the badge.
  await poll(async () => {
    renderNotifications(await api(`/api/users/${me.id}/notifications/`));
    const cleared = await api(`/api/users/${me.id}/notifications/`, {});
    $("badge").classList.add("hidden");
    $("bell").setAttribute("aria-label", `Notifications (${cleared.unread} unread)`);
  });
};

$("notif-panel").addEventListener("click", (e) => e.stopPropagation());

// ---- Email alerts (AWS SNS) ---------------------------------------------
const EMAIL_STATUS_TEXT = {
  none: () => "",
  pending: (email) => `Almost there: click the confirmation link AWS emailed to ${email}.`,
  on: (email) => `Email alerts are on for ${email}.`,
};

function showEmailStatus(data) {
  $("email-alerts").classList.toggle("hidden", !data.available);
  if (!data.available) return;
  if (data.email && document.activeElement !== $("email-input")) $("email-input").value = data.email;
  $("email-status").className = `email-status ${data.status === "on" ? "on" : ""}`;
  $("email-status").textContent = (EMAIL_STATUS_TEXT[data.status] || EMAIL_STATUS_TEXT.none)(data.email);
}

function showEmailProblem(message) {
  $("email-status").className = "email-status problem";
  $("email-status").textContent = message;
}

async function loadEmailAlerts() {
  if (!me) return;
  try {
    showEmailStatus(await api(`/api/users/${me.id}/email-alerts/`));
  } catch (err) {
    showEmailProblem(err.message);
  }
}

$("email-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = $("email-form").querySelector("button");
  button.disabled = true;
  try {
    showEmailStatus(await api(`/api/users/${me.id}/email-alerts/`, { email: $("email-input").value.trim() }));
  } catch (err) {
    showEmailProblem(err.message);
  } finally {
    button.disabled = false;
  }
});
document.addEventListener("click", closeNotifPanel);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeNotifPanel(); });

loadDemoPicks();
</script>
